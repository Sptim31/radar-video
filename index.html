<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Radar Vidéo France</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#eef1f4; --ink:#17202b; --muted:#5b6878; --accent:#1f4fd1; --accent-soft:#e3eafc; --live:#e0424a;
  --panel:#ffffff; --line:#d5dce5; --halo:#ffffff; color-scheme:light;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e131a; --ink:#e7ecf2; --muted:#93a0b0; --accent:#7398ff; --accent-soft:#1c2846; --live:#ff666c;
  --panel:#141b24; --line:#283241; --halo:#0b131c; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 var(--f-body);overflow:hidden}
.app{height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);z-index:2}
.brand{display:flex;align-items:center;gap:8px}
.brand h1{font:800 19px var(--f-display);margin:0;letter-spacing:-.01em;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--live);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
form.search{flex:1 1 220px;display:flex;gap:6px;min-width:0}
input,button{font:inherit}
form.search input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.btn{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{flex:1;min-height:0;display:flex;flex-direction:column}
#map{flex:1 1 50%;min-height:240px;background:var(--bg)}
aside{flex:1 1 50%;min-height:0;overflow:auto;background:var(--panel);border-top:1px solid var(--line);padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){main{flex-direction:row}#map{flex:1}aside{flex:0 0 420px;border-top:0;border-left:1px solid var(--line)}}
.eyebrow{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.place{font:800 26px/1.05 var(--f-display);margin:4px 0 12px;text-wrap:balance}
.datebox{display:flex;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:10px}
.datebox .day{flex:1;min-width:0}
.long{font:600 16px var(--f-display);text-transform:capitalize}
.rel{font:12px var(--f-mono);color:var(--muted)}
.datebox input{font:12px var(--f-mono);padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);max-width:140px}
.nav{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.nav:disabled{opacity:.35;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.toggle{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;color:var(--muted)}
.status{margin:14px 0 8px;font:12px var(--f-mono);color:var(--muted)}
.status.err{color:var(--live)}
.list{display:flex;flex-direction:column;gap:10px}
.vid{display:grid;grid-template-columns:132px 1fr;gap:10px;padding:0;border:0;background:none;color:var(--ink);text-align:left;cursor:pointer;border-radius:8px}
.vid:hover .t{color:var(--accent)}
.thumb{position:relative;aspect-ratio:16/9;border-radius:8px;overflow:hidden;background:var(--line);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .dur{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.8);color:#fff;font:11px var(--f-mono);padding:1px 4px;border-radius:3px}
.thumb .lv{position:absolute;left:4px;top:4px;background:var(--live);color:#fff;font:600 10px var(--f-mono);padding:1px 5px;border-radius:3px}
.vid .t{font-weight:600;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.vid .m{font-size:12px;color:var(--muted);margin-top:3px}
.vid .geo{color:var(--accent)}
.empty{padding:24px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:10px}
/* mode cinéma */
.theater{position:fixed;inset:0;z-index:3000;background:#050608;color:#f2f4f7;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 16px env(safe-area-inset-bottom,0px)}
.tbar{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #1d222b;min-width:0}
.tdot{width:8px;height:8px;border-radius:50%;background:#ff3b3b;flex:none}
.tevent{font:800 15px var(--f-display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap}
.tsub{font:11px var(--f-mono);color:#8b93a1;white-space:nowrap}
.ttabs{display:flex;gap:4px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.ttabs button{background:none;border:0;border-bottom:2px solid transparent;color:#aab2bf;font:600 12px var(--f-body);padding:6px 8px;white-space:nowrap;cursor:pointer}
.ttabs button[aria-current="true"]{color:#fff;border-bottom-color:#ff3b3b}
.ttabs .n{display:inline-block;margin-left:4px;font:10px var(--f-mono);background:#1d222b;color:#cfd5de;border-radius:4px;padding:0 4px}
.ttabs button[aria-current="true"] .n{background:#ff3b3b;color:#fff}
.tctl{display:flex;gap:6px;flex:none}
.tbtn{background:none;border:1px solid #3a2226;color:#ff6b6b;font:600 11px var(--f-mono);padding:5px 8px;border-radius:5px;cursor:pointer}
.tbtn[aria-pressed="true"]{background:#ff3b3b;border-color:#ff3b3b;color:#fff}
.thead{padding:8px 0 6px;border-left:3px solid #ff3b3b;padding-left:14px;margin-top:10px}
.thead h2{margin:0;font:800 clamp(24px,4vw,40px)/1 var(--f-display);text-transform:uppercase;letter-spacing:-.01em}
.tmeta{font:11px var(--f-mono);color:#8b93a1;margin-top:6px}
.tstage{flex:1;min-height:0;display:flex;align-items:stretch;gap:10px;padding:6px 0}
.tstage .tarrow{align-self:center}
.tframe{flex:1;min-width:0;height:100%;container-type:size;display:flex;align-items:center;justify-content:center}
.tframe iframe,.tframe #ytp{width:min(100cqw,calc(100cqh * var(--ar,1.7778)));height:min(100cqh,calc(100cqw / var(--ar,1.7778)));border:0;background:#000;border-radius:6px}
.tarrow{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid #2a303a;background:#111419;color:#fff;font-size:18px;cursor:pointer}
.tarrow:disabled{opacity:.3}
.tcap{font:600 clamp(15px,1.8vw,20px)/1.3 var(--f-body);text-align:center;max-width:70ch;margin:0 auto;padding:4px 0 10px;text-wrap:balance}
.tstrip{display:flex;gap:6px;overflow-x:auto;padding:8px 0 12px;scrollbar-width:thin}
.tstrip button{flex:none;width:96px;padding:0;border:2px solid transparent;border-radius:4px;background:#111;cursor:pointer;color:#cfd5de;text-align:left}
.tstrip button[aria-current="true"]{border-color:#ff3b3b}
.tstrip img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:2px}
.tstrip span{display:block;font:10px var(--f-mono);padding:2px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:640px){.tarrow{display:none}.tsub{display:none}}
/* lecteur */
.modal{position:fixed;inset:0;z-index:2000;background:rgba(5,8,12,.86);display:flex;align-items:center;justify-content:center;padding:16px}
.player{width:min(960px,100%);display:flex;flex-direction:column;gap:10px}
.close-top{align-self:flex-end;padding:8px 14px;border-radius:8px;border:1px solid #3a4757;background:#141b24;color:#fff;cursor:pointer;font-weight:600}
.frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pinfo{color:#fff;display:flex;gap:10px;align-items:flex-start}
.pinfo .txt{flex:1;min-width:0}
.pinfo .t{font:600 16px var(--f-display)}
.pinfo .m{font-size:12px;color:#b8c2cf;margin-top:2px}
.ext{display:inline-block;margin-top:6px;font-size:12px;color:#9db6ff}
.pbtn{width:40px;height:40px;border-radius:8px;border:1px solid #3a4757;background:#141b24;color:#fff;cursor:pointer;font-size:18px}
/* marqueurs */
.vpin{width:26px;height:26px;border-radius:50%;background:var(--live);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);display:grid;place-items:center;color:#fff;font-size:10px}
.cpin{background:transparent;border:0}
.cpin span{display:block;border-radius:50%;background:var(--accent);border:2px solid var(--halo)}
.clabel{background:none;border:0;box-shadow:none;font:600 12px var(--f-body);color:var(--ink);text-shadow:0 0 3px var(--halo),0 0 3px var(--halo)}
.clabel::before{display:none}
.marker-cluster{background:color-mix(in srgb,var(--live) 30%,transparent);border-radius:50%}
.marker-cluster div{background:var(--live);color:#fff;font:600 12px var(--f-mono);width:30px;height:30px;margin:5px;border-radius:50%;display:grid;place-items:center}
.leaflet-container{font-family:var(--f-body)}
@media (prefers-color-scheme:dark){.tiles{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}

.marker-cluster,.marker-cluster div{background:none!important}
.bub{display:grid;place-items:center;border-radius:50%;background:var(--live);color:#fff;font:600 12px var(--f-mono);border:2px solid var(--halo);box-shadow:0 1px 6px rgba(0,0,0,.35);cursor:pointer}
.bub.cl{background:var(--accent)}
.keycard{margin-top:14px;padding:14px;border:1px solid var(--accent);border-radius:10px;background:var(--accent-soft)}
.keycard .kt{font:600 15px var(--f-display);margin-bottom:6px}
.keycard ol{margin:0 0 10px;padding-left:18px;line-height:1.5}
.keycard a{color:var(--accent)}
.keyform{display:flex;gap:6px}
.keyform input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-family:var(--f-mono)}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.actions:empty{display:none}
.social{flex-basis:100%;margin-top:4px}
.srow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.sbtn{padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:13px;font-weight:600;box-shadow:inset 3px 0 0 var(--c)}
.sbtn:hover{border-color:var(--accent)}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span class="dot"></span><h1>Radar Vidéo France</h1></div>
    <form class="search" id="searchForm" autocomplete="off">
      <input id="q" list="placesList" placeholder="Ville (même petite) ou sujet…" aria-label="Chercher">
      <datalist id="placesList"></datalist>
      <button class="btn primary" type="submit">Aller</button>
    </form>
    <button class="btn" id="keyBtn" type="button">Clé YouTube</button>
  </header>
  <main>
    <div id="map"></div>
    <aside>
      <div class="eyebrow" id="kind">Pays</div>
      <div class="place" id="placeName">France</div>
      <div class="datebox">
        <button class="nav" id="prev" aria-label="Jour précédent">‹</button>
        <div class="day"><div class="long" id="longDate"></div><div class="rel" id="relDate"></div></div>
        <button class="nav" id="next" aria-label="Jour suivant">›</button>
        <input type="date" id="dateInput" aria-label="Choisir une date">
      </div>
      <div class="row" id="themes"></div>
      <div class="row" id="durs"></div>

      <section class="keycard" id="keyCard" hidden>
        <div class="kt">Une seule fois : ta clé YouTube</div>
        <ol>
          <li>Ouvre <a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank" rel="noopener">YouTube Data API v3</a> et clique <b>Activer</b> (crée un projet si on te le demande).</li>
          <li>Va dans <a href="https://console.cloud.google.com/apis/credentials" target="_blank" rel="noopener">Identifiants</a> → <b>Créer des identifiants</b> → <b>Clé API</b>.</li>
          <li>Colle la clé ici. Elle reste dans ton navigateur.</li>
        </ol>
        <form id="keyForm" class="keyform">
          <input id="keyInput" placeholder="AIza…" aria-label="Clé API YouTube" autocomplete="off">
          <button class="btn primary" type="submit">Enregistrer</button>
        </form>
      </section>

      <div class="status" id="status"></div>
      <div class="actions" id="actions"></div>
      <div class="list" id="list"></div>
    </aside>
  </main>
</div>

<div class="theater" id="theater" hidden>
  <div class="tbar">
    <span class="tdot"></span><b class="tevent" id="tEvent"></b><span class="tsub" id="tRange"></span>
    <nav class="ttabs" id="tTabs"></nav>
    <div class="tctl"><button id="tAuto" class="tbtn" aria-pressed="true">AUTO</button><button id="tClose" class="tbtn" aria-label="Fermer">✕</button></div>
  </div>
  <div class="thead"><h2 id="tCity"></h2><div class="tmeta" id="tMeta"></div></div>
  <div class="tstage">
    <button class="tarrow" id="tPrev" aria-label="Vidéo précédente">‹</button>
    <div class="tframe"><div id="ytp"></div></div>
    <button class="tarrow" id="tNext" aria-label="Vidéo suivante">›</button>
  </div>
  <div class="tcap" id="tCap"></div>
  <div class="tstrip" id="tStrip"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>
<script>
const LOCAL_MEDIA='"France 3"|"ici"|"Ouest-France"|"La Dépêche"|"Le Parisien"|"actu.fr"|"Nice-Matin"|"Sud Ouest"|"La Voix du Nord"|"Le Progrès"|"Le Dauphiné"|"BFM"|"Le Télégramme"|"La Provence"';
const THEMES=[
  ["Tout",null],
  ["Attentats",/attentat|terroris|antiterror|pnat|djihad|jihad|islamis|radicalis|fiché s|vigipirate|assaillant|attaque au couteau|attaque à l'arme|prise d'otages?|neutralisé|cellule de crise|minute de silence|hommage aux victimes/i],
  ["Faits divers",/faits? divers|police|gendarm|interpell|agress|meurtre|homicide|tué|poignard|cambriol|braquage|disparu|enquête|garde à vue|tribunal|procès|condamn|violences?/i],
  ["Météo",/météo|tempête|orage|inond|vigilance|neige|canicule|crue|intempéries|grêle|rafales|tornade/i],
  ["Manifs",/manif|grève|mobilisation|rassemblement|cortège|syndica|blocage|émeute|violences urbaines|black bloc/i],
  ["Accidents",/accident|collision|percut|carambolage|crash|renvers|sortie de route|chauffard/i],
  ["Incendies",/incendie|pompiers|flammes|brûl|explosion|feu de forêt|feux/i],
  ["Politique",/gouvernement|ministre|assemblée|sénat|élection|municipales|présidentielle|député|macron|premier ministre|motion de censure|budget|rn |lfi|ps |républicains|bardella|le pen|mélenchon/i],
  ["Justice",/tribunal|procès|juge|condamn|cour d'assises|parquet|mis en examen|garde à vue|avocat|verdict|prison|détention/i],
  ["Sport",/match|ligue 1|ligue 2|rugby|top 14|football|basket|handball|psg|olympique|stade|supporters|but |victoire|défaite/i]
];
const $=id=>document.getElementById(id);
const S={date:today(),theme:0,videos:[],shown:[],city:null,text:null,idx:-1,req:0};
let COMMUNES=[], REGIONS=[], IDX=new Map();

/* ---------- dates ---------- */
function today(){return iso(new Date())}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function daysAgo(s){return Math.round((parse(today())-parse(s))/864e5)}

/* ---------- stockage ---------- */
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch{return null}},
  set(k,v){const w=()=>localStorage.setItem(k,JSON.stringify(v));try{w()}catch{try{Object.keys(localStorage).filter(x=>/^rv\d*:\d{4}-/.test(x)&&x!==k).forEach(x=>localStorage.removeItem(x));w()}catch{}}}};
try{Object.keys(localStorage).filter(x=>/^rv[2345]?:\d{4}-/.test(x)).forEach(x=>localStorage.removeItem(x))}catch{}
const DEFAULT_KEY="AIzaSyDAloESeGf9nw0KKT_u_05knDop5uTksbM";
function getKey(){try{return localStorage.getItem("rv:key")||DEFAULT_KEY}catch{return DEFAULT_KEY}}

/* ---------- carte ---------- */
const map=L.map("map",{zoomControl:true,worldCopyJump:true}).setView([46.6,2.4],6);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,className:"tiles",attribution:'&copy; OpenStreetMap'}).addTo(map);
const bubbles=L.markerClusterGroup({
  showCoverageOnHover:false,maxClusterRadius:45,spiderfyOnMaxZoom:false,zoomToBoundsOnClick:true,
  iconCreateFunction:c=>{const n=c.getAllChildMarkers().reduce((a,m)=>a+m.options.count,0);return bubbleIcon(n,true)}
}).addTo(map);
function bubbleIcon(n,cluster){const s=Math.round(Math.min(58,22+Math.sqrt(n)*7));
  return L.divIcon({className:"",html:`<div class="bub${cluster?" cl":""}" style="width:${s}px;height:${s}px">${n}</div>`,iconSize:[s,s]})}

/* ---------- reconnaissance des villes dans les titres ---------- */
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
function buildIndex(){ COMMUNES.forEach((c,i)=>{const k=norm(c[0]); if(!IDX.has(k)) IDX.set(k,i)}) } // trié par population : la plus grande gagne
const SMALL=new Set(["de","du","des","la","le","les","sur","en","et","d","l","aux","au","sous","lès","lez","à"]);
function findCity(text){
  if(!text) return -1;
  const toks=text.split(/[^\p{L}\p{N}]+/u).filter(Boolean);
  const nt=toks.map(norm);
  for(let i=0;i<toks.length;i++){
    if(!/^\p{Lu}/u.test(toks[i])) continue;
    for(let n=Math.min(6,toks.length-i);n>=1;n--){
      const id=IDX.get(nt.slice(i,i+n).join(" "));
      if(id!==undefined && toks.slice(i,i+n).every(t=>SMALL.has(t.toLowerCase())||/^[\p{Lu}\p{N}]/u.test(t))) return id;
    }
  }
  return -1;
}
function decode(s){const t=document.createElement("textarea");t.innerHTML=s;return t.value}

/* ---------- YouTube ---------- */
async function yt(params){
  const p=new URLSearchParams({part:"snippet",type:"video",maxResults:"50",order:"date",regionCode:"FR",relevanceLanguage:"fr",safeSearch:"moderate",videoCategoryId:"25",key:getKey(),...params});
  const r=await fetch("https://www.googleapis.com/youtube/v3/search?"+p); const j=await r.json();
  if(j.error){const reason=(j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason)||"";
    const e=new Error(reason.includes("quota")||reason==="dailyLimitExceeded"?"Quota YouTube du jour épuisé (il revient vers 9h).":
      /key|API_KEY|keyInvalid/i.test(j.error.message+reason)?"Clé YouTube refusée. Vérifie-la (bouton Clé YouTube).":"YouTube : "+j.error.message);
    e.keyErr=/key/i.test(j.error.message+reason)&&!reason.includes("quota"); if(/quota/i.test(reason+j.error.message)) e.message="Quota de recherche YouTube épuisé pour aujourd'hui : la recherche par ville revient demain. La carte, elle, marche toujours."; throw e}
  return j;
}
function dayRange(){const a=parse(S.date), b=parse(addDays(S.date,1));return {publishedAfter:a.toISOString(),publishedBefore:b.toISOString()}}
function toVideo(it){const sn=it.snippet;return {id:it.id.videoId,title:decode(sn.title),desc:decode(sn.description||""),channel:decode(sn.channelTitle),
  ts:Date.parse(sn.publishedAt),thumb:(sn.thumbnails.medium||sn.thumbnails.default).url,live:sn.liveBroadcastContent==="live",city:-1}}
const FR_WORDS=new Set("le la les des du un une est et à au aux pour sur dans avec qui ce cette après contre par pas plus été sont mais leur nous vous ont deux ans hier soir matin".split(" "));
const JUNK=/\b(minecraft|fortnite|roblox|gta|call of duty|warzone|valorant|league of legends|pokemon|pokémon|gameplay|let'?s play|jeu vidéo|jeux vidéo|gaming|quiz|tuto|tutoriel|formation|ssiap|unboxing|asmr|prank|réaction|react|horoscope|tirage|voyance|recette|vlog|clip officiel|official video|karaoké|lyrics|paroles|sims)\b/i;
function isNews(v){
  if(v.cat && v.cat!=="25" && v.cat!=="17") return false;
  if(JUNK.test(v.title)||JUNK.test(v.channel)) return false;
  return true;
}
function isFrench(v){
  const t=v.title+" "+v.desc.slice(0,300);
  if(/[\u0400-\u04FF\u0590-\u06FF\u0900-\u0DFF\u0E00-\u0E7F\u3040-\u30FF\u4E00-\u9FFF\uAC00-\uD7AF]/.test(v.title)) return false;
  if(v.lang && !/^fr/i.test(v.lang)) return false;
  const w=t.toLowerCase().split(/[^a-zàâçéèêëîïôûùüÿœ']+/); let n=0; for(const x of w) if(FR_WORDS.has(x)) n++;
  return n>=3 || (/[éèàçê]/.test(t) && n>=1);
}
function isoDur(d){const m=/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(d||"");return m?(+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0):0}
function fmtDur(s){if(!s)return"";const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(x).padStart(2,"0")}`:`${m}:${String(x).padStart(2,"0")}`}
const FOREIGN=/\b(togo|togolais|côte d.ivoire|ivoirien|cameroun|sénégal|mali|malien|burkina|niger|guinée|congo|rdc|kinshasa|gabon|bénin|tchad|madagascar|algérie|algérien|maroc|marocain|tunisie|tunisien|haïti|haïtien|québec|canada|belgique|bruxelles|suisse|genève|liban|israël|gaza|palestin|ukraine|russie|poutine|états-unis|usa|trump|iran|syrie|chine|inde)\b/i;
function nearestCommune(lat,lng){
  if(lat<41||lat>51.2||lng<-5.3||lng>9.7) return -1;
  let best=-1,bd=1e9; const k=Math.cos(lat*Math.PI/180);
  for(let i=0;i<COMMUNES.length;i++){const c=COMMUNES[i]; const d=(c[1]-lat)**2+((c[2]-lng)*k)**2; if(d<bd){bd=d;best=i}}
  return bd<0.0025?best:-1; // ~5 km
}
function locate(v){
  let c=v.lat!=null?nearestCommune(v.lat,v.lng):-1;
  if(c<0) c=findCity(v.title);
  const foreign=FOREIGN.test(v.title)||FOREIGN.test((v.tags||"").slice(0,200));
  if(c<0&&!foreign&&v.tags) c=findCity(v.tags);
  if(c<0&&!foreign) c=findCity(v.desc.slice(0,250));
  v.city=c; return v}

async function fetchSet(cacheKey,queries,pages){
  const hit=store.get(cacheKey), fresh=daysAgo(S.date)===0?30*60e3:7*864e5;
  if(hit && Date.now()-hit.t<fresh) return hit.v;
  const seen=new Map();
  for(const q of queries){
    let token="";
    for(let p=0;p<pages;p++){
      const j=await yt({q,...dayRange(),...(token?{pageToken:token}:{})});
      (j.items||[]).forEach(it=>{ if(it.id.videoId && !seen.has(it.id.videoId)) seen.set(it.id.videoId,toVideo(it)) });
      token=j.nextPageToken; if(!token) break;
    }
  }
  const ids=[...seen.keys()];
  for(let i=0;i<ids.length;i+=50){
    const p=new URLSearchParams({part:"snippet,recordingDetails,contentDetails",id:ids.slice(i,i+50).join(","),key:getKey()});
    try{const j=await (await fetch("https://www.googleapis.com/youtube/v3/videos?"+p)).json();
      (j.items||[]).forEach(it=>{const v=seen.get(it.id); if(!v) return; const sn=it.snippet||{};
        v.desc=decode(sn.description||v.desc); v.tags=(sn.tags||[]).slice(0,25).join(" , "); v.lang=sn.defaultAudioLanguage||sn.defaultLanguage||""; v.dur=isoDur((it.contentDetails||{}).duration); v.cat=sn.categoryId||"";
        const loc=it.recordingDetails&&it.recordingDetails.location; if(loc&&loc.latitude!=null){v.lat=loc.latitude;v.lng=loc.longitude}})}catch{}
  }
  const v=[...seen.values()].sort((a,b)=>b.ts-a.ts).map(x=>({...x,desc:x.desc.slice(0,600)})).filter(v=>isFrench(v)&&isNews(v));
  store.set(cacheKey,{t:Date.now(),v}); return v;
}

const HANDLES=["@BFMTV","@franceinfo","@TF1INFO","@LeParisien","@lemondefr","@LeFigaro","@20minutesfr","@CNEWS","@LCI","@France24_fr","@Europe1","@RMCinfo","@libe","@LeHuffPost","@BrutFR","@franceinter",
 "@OuestFrance","@ladepeche","@SudOuest","@lavoixdunord","@leprogres","@ledauphinelibere","@nicematin","@laprovence","@letelegramme","@actufr","@Actu17","@MidiLibre","@lanouvellerepublique","@lamontagne","@estrepublicain","@dna","@leRepublicainLorrain","@courrierpicard","@paris-normandie","@lunion","@varmatin","@corsematin","@lest-eclair","@presseocean",
 "@BFMParis","@BFMLyon","@BFMMarseille","@BFMGrandLille","@BFMToulouse","@BFMAlsace","@BFMNiceCotedAzur","@BFMDICI","@BFMNormandie","@BFMBordeaux","@BFMGrandLittoral","@BFMRegions",
 "@France3Regions","@france3paris","@france3hautsdefrance","@france3bretagne","@france3occitanie","@france3aura","@France3PACA","@france3grandest","@france3nouvelleaquitaine","@france3normandie","@France3PaysdelaLoire","@france3centre","@france3bfc","@france3corse","@icifrancebleu","@ici"];
async function api(path,params){
  const r=await fetch(`https://www.googleapis.com/youtube/v3/${path}?`+new URLSearchParams({key:getKey(),...params})); const j=await r.json();
  if(j.error){const reason=(j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason)||""; const e=new Error(/quota/i.test(reason+j.error.message)?"Quota YouTube du jour épuisé (il revient vers 9h).":"YouTube : "+j.error.message);
    e.fatal=/quota|key|forbidden/i.test(reason+j.error.message); e.keyErr=/key/i.test(j.error.message+reason)&&!/quota/i.test(reason); throw e}
  return j;
}
async function pool(items,n,fn){let k=0;await Promise.all(Array.from({length:Math.min(n,items.length)},async()=>{while(k<items.length){const it=items[k++];await fn(it)}}))}
async function channels(){
  const m=store.get("rv:ch")||{}; const missing=HANDLES.filter(h=>!(h in m));
  if(missing.length){ setStatus("Recherche des médias…");
    await pool(missing,6,async h=>{ try{const j=await api("channels",{part:"contentDetails,snippet",forHandle:h}); const it=j.items&&j.items[0];
      m[h]=it?{u:it.contentDetails.relatedPlaylists.uploads,n:it.snippet.title}:null}catch(e){ if(e.fatal) throw e } });
    store.set("rv:ch",m) }
  const seen=new Set(); return Object.values(m).filter(c=>c&&!seen.has(c.u)&&seen.add(c.u));
}
async function fetchDay(){
  const key=`rv6:${S.date}`, hit=store.get(key), fresh=daysAgo(S.date)===0?15*60e3:7*864e5;
  if(hit && Date.now()-hit.t<fresh) return hit.v;
  const chans=await channels(); const start=+parse(S.date), end=+parse(addDays(S.date,1)); const maxPages=3+Math.min(daysAgo(S.date),7)*2;
  const seen=new Map(); let done=0;
  await pool(chans,6,async ch=>{ let token="";
    try{ for(let p=0;p<maxPages;p++){
      const j=await api("playlistItems",{part:"snippet,contentDetails",playlistId:ch.u,maxResults:"50",...(token?{pageToken:token}:{})});
      let older=false;
      for(const it of j.items||[]){ const sn=it.snippet||{}, id=(it.contentDetails||{}).videoId; if(!id||/^(Private|Deleted) video$/.test(sn.title)) continue;
        const t=Date.parse(it.contentDetails.videoPublishedAt||sn.publishedAt); if(t<start){older=true;continue} if(t>=end||seen.has(id)) continue;
        seen.set(id,{id,title:decode(sn.title),desc:decode(sn.description||"").slice(0,600),channel:ch.n,ts:t,
          thumb:((sn.thumbnails||{}).medium||(sn.thumbnails||{}).default||{}).url||`https://i.ytimg.com/vi/${id}/mqdefault.jpg`,live:false,city:-1}) }
      token=j.nextPageToken; if(older||!token) break } }catch(e){ if(e.fatal) throw e }
    setStatus(`Chargement… ${++done}/${chans.length} médias`) });
  const ids=[...seen.keys()];
  await pool(Array.from({length:Math.ceil(ids.length/50)},(_,k)=>ids.slice(k*50,k*50+50)),4,async chunk=>{
    try{const j=await api("videos",{part:"snippet,recordingDetails,contentDetails,player",maxHeight:"360",id:chunk.join(",")});
      (j.items||[]).forEach(it=>{const v=seen.get(it.id); if(!v) return; const sn=it.snippet||{};
        v.tags=(sn.tags||[]).slice(0,25).join(" , "); v.live=sn.liveBroadcastContent==="live"; v.dur=isoDur((it.contentDetails||{}).duration);
        const pl=it.player||{}; if(pl.embedWidth&&pl.embedHeight) v.ar=+pl.embedWidth/+pl.embedHeight;
        const loc=it.recordingDetails&&it.recordingDetails.location; if(loc&&loc.latitude!=null){v.lat=loc.latitude;v.lng=loc.longitude}})}catch{} });
  const v=[...seen.values()].filter(x=>!JUNK.test(x.title)).sort((a,b)=>b.ts-a.ts);
  store.set(key,{t:Date.now(),v}); return v;
}
async function load(){
  S.city=null; S.text=null; renderHeader();
  if(!getKey()){ $("keyCard").hidden=false; setStatus(""); $("list").innerHTML=""; bubbles.clearLayers(); return }
  const id=++S.req;
  setStatus("Chargement des vidéos du jour…"); $("list").innerHTML=""; $("actions").innerHTML="";
  try{
    const v=await fetchDay();
    if(id!==S.req) return;
    S.videos=v.map(locate); drawBubbles(); show(null);
  }catch(e){ if(id===S.req){ setStatus(e.message,true); if(e.keyErr) $("keyCard").hidden=false } }
}
function drawBubbles(){
  bubbles.clearLayers();
  const count=new Map(); S.videos.forEach(v=>{ if(v.city>=0&&okDur(v)) count.set(v.city,(count.get(v.city)||0)+1) });
  count.forEach((n,ci)=>{const c=COMMUNES[ci];
    L.marker([c[1],c[2]],{icon:bubbleIcon(n,false),count:n,title:c[0]+" · "+n+" vidéo"+(n>1?"s":"")})
      .on("click",()=>selectCity(ci,false)).addTo(bubbles)});
}

async function moreForCity(ci){

const T={list:[],i:0,tab:"all",auto:true,player:null,ready:false,pending:null};
function regionOf(v){return v.city>=0?COMMUNES[v.city][4]:-1}
function tabList(tab){
  const all=S.videos.filter(okDur);
  const l=tab==="all"?all.filter(v=>v.city>=0):tab==="none"?all.filter(v=>v.city<0):tab==="city"?all.filter(v=>v.city===T.cityIdx):all.filter(v=>regionOf(v)===tab);
  return l.slice().sort((a,b)=>a.ts-b.ts);
}
function renderTabs(){
  const all=S.videos.filter(okDur), cnt=new Map(); let none=0;
  all.forEach(v=>{const r=regionOf(v); if(r<0) none++; else cnt.set(r,(cnt.get(r)||0)+1)});
  const tabs=[["map","Carte",null],["all","Toute la France",all.length-none]];
  if(T.cityIdx!=null) tabs.push(["city",COMMUNES[T.cityIdx][0],all.filter(v=>v.city===T.cityIdx).length]);
  [...cnt.entries()].sort((a,b)=>b[1]-a[1]).forEach(([r,n])=>tabs.push([r,REGIONS[r],n]));
  if(none) tabs.push(["none","Non classé",none]);
  const nav=$("tTabs"); nav.innerHTML="";
  tabs.forEach(([id,lab,n])=>{const b=document.createElement("button");b.textContent=lab;
    if(n!=null){const c=document.createElement("span");c.className="n";c.textContent=n;b.appendChild(c)}
    b.setAttribute("aria-current",id===T.tab);
    b.onclick=()=>{ if(id==="map") return closeTheater(); T.tab=id; T.list=tabList(id); T.i=0; renderTabs(); renderStrip(); go(0) };

function renderStrip(){

function openTheater(list,start,tab,cityIdx){
  T.cityIdx=cityIdx; T.tab=tab; T.list=list.slice().sort((a,b)=>a.ts-b.ts);
  const v0=list[start]; T.i=Math.max(0,T.list.indexOf(v0));

  $("tEvent").textContent=(th==="Tout"?"Actu":th)+" du "+d.toLocaleDateString("fr-FR",{day:"numeric",month:"long"});
  $("tRange").textContent=d.toLocaleDateString("fr-FR",{weekday:"long",year:"numeric"});
  $("theater").hidden=false; renderTabs(); renderStrip(); go(T.i);

function go(k){
  if(!T.list.length){$("tCity").textContent="Aucune vidéo";$("tMeta").textContent="";$("tCap").textContent="";return}
  k=Math.max(0,Math.min(T.list.length-1,k)); T.i=k; const v=T.list[k];
  $("tCity").textContent=v.city>=0?COMMUNES[v.city][0]:"France";
  const reg=v.city>=0?REGIONS[COMMUNES[v.city][4]]:"Non classé";
  $("tMeta").textContent=`${reg} · ${new Date(v.ts).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})} · ${fmtTime(v.ts)} · ${k+1}/${T.list.length} · ${v.channel}`;
  $("tCap").textContent=v.title;
  $("tPrev").disabled=k===0; $("tNext").disabled=k===T.list.length-1;
  document.querySelectorAll("#tStrip button").forEach((b,n)=>b.setAttribute("aria-current",n===k));
  const cur=$("tStrip").children[k]; if(cur) cur.scrollIntoView({block:"nearest",inline:"center",behavior:"smooth"});
  const ar=v.ar||((/#shorts?\b/i.test(v.title)||(v.dur&&v.dur<=60))?9/16:16/9);
  document.querySelector(".tframe").style.setProperty("--ar",ar);
  loadVideo(v.id);
}
function loadVideo(id){
  if(T.player&&T.ready){T.player.loadVideoById(id);return}
  T.pending=id;
  if(!T.player && window.YT && YT.Player){
    T.player=new YT.Player("ytp",{host:"https://www.youtube-nocookie.com",videoId:id,
      playerVars:{autoplay:1,rel:0,playsinline:1,modestbranding:1},
      events:{onReady:e=>{T.ready=true; if(T.pending&&T.pending!==id) e.target.loadVideoById(T.pending); else e.target.playVideo()},
              onStateChange:e=>{ if(e.data===0 && T.auto && T.i<T.list.length-1) go(T.i+1) },
              onError:()=>{ if(T.auto && T.i<T.list.length-1) setTimeout(()=>go(T.i+1),800) }}});
  } else if(!window.YT || !YT.Player){ // API pas encore prête : iframe simple
    $("ytp").outerHTML=`<iframe id="ytp" src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0&playsinline=1" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title=""></iframe>`;
  }
}
function closeTheater(){ $("theater").hidden=true; if(T.player&&T.ready) T.player.stopVideo(); else { const f=document.querySelector("iframe#ytp"); if(f) f.outerHTML='<div id="ytp"></div>' } }
function play(i){ const v=S.shown[i]; const tab=S.city!=null?"city":(v&&v.city<0?"none":"all"); openTheater(tabList(tab).length?S.shown:S.shown,i,tab,S.city) }
$("tClose").onclick=closeTheater;
$("tPrev").onclick=()=>go(T.i-1); $("tNext").onclick=()=>go(T.i+1);
$("tAuto").onclick=()=>{T.auto=!T.auto;$("tAuto").setAttribute("aria-pressed",T.auto)};
document.addEventListener("keydown",e=>{ if($("theater").hidden) return;
  if(e.key==="Escape")closeTheater(); if(e.key==="ArrowRight")go(T.i+1); if(e.key==="ArrowLeft")go(T.i-1)});

/* ---------- clé ---------- */
$("keyBtn").onclick=()=>{$("keyCard").hidden=!$("keyCard").hidden; $("keyInput").value=getKey()};
$("keyForm").onsubmit=e=>{e.preventDefault(); const k=$("keyInput").value.trim(); if(!k) return;
  try{localStorage.setItem("rv:key",k)}catch{} $("keyCard").hidden=true; load()};

/* ---------- recherche ---------- */
$("searchForm").onsubmit=async e=>{
  e.preventDefault(); const raw=$("q").value.trim(); if(!raw) return;
  const ci=IDX.get(norm(raw)); if(ci!==undefined) return selectCity(ci,true);
  if(!getKey()){ $("keyCard").hidden=false; return }
  const id=++S.req; S.text=raw; S.city=null; renderHeader(); setStatus("Recherche…"); $("actions").innerHTML="";
  try{ const v=await fetchSet(`rv4:${S.date}:q:${norm(raw)}`,[raw],1); if(id!==S.req) return;
    S.shown=v.map(locate); renderList(S.shown); setStatus(`${v.length} vidéos pour « ${raw} »`);
    const a=document.createElement("button");a.className="btn";a.textContent="← Toute la France";a.onclick=()=>{S.text=null;load()};$("actions").append(a);
  }catch(err){ if(id===S.req) setStatus(err.message,true) }
};
$("q").addEventListener("input",()=>{ // propose les communes au fil de la frappe
  const v=norm($("q").value); const dl=$("placesList"); dl.innerHTML=""; if(v.length<2) return;
  let n=0; for(const c of COMMUNES){ if(norm(c[0]).startsWith(v)){const o=document.createElement("option");o.value=c[0];dl.appendChild(o); if(++n>=12) break} }
});

/* ---------- démarrage ---------- */
renderHeader(); setStatus("Chargement des villes…");
fetch("communes.json").then(r=>r.json()).then(d=>{COMMUNES=d.c; REGIONS=d.regions; buildIndex(); load()})
  .catch(()=>setStatus("Impossible de charger la liste des villes.",true));
</script>
</body>
</html>
